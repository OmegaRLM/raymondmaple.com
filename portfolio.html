<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfolio — Raymond Maple</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="portfolio.css" />
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
    }
  }
  </script>
</head>
<body class="pf-page">

  <nav class="nav">
    <div class="nav-inner">
      <a href="/" class="nav-logo">
        <span class="prompt">~</span><span class="nav-name">raymond maple</span><span class="cursor">▋</span>
      </a>
      <ul class="nav-links">
        <li><a href="/#portfolio">portfolio</a></li>
        <li><a href="/#blog">blog</a></li>
        <li><a href="/#apps">projects</a></li>
        <li><a href="/#education">education</a></li>
        <li><a href="/about.html">about</a></li>
      </ul>
      <button class="nav-toggle" aria-label="Toggle menu">☰</button>
    </div>
  </nav>

  <div class="pf-layout">

    <!-- Left: 3D scene -->
    <div class="pf-scene-panel">
      <canvas id="pf-canvas"></canvas>
      <button class="pf-nav-btn pf-prev" id="pf-prev" aria-label="Previous game">&#8249;</button>
      <button class="pf-nav-btn pf-next" id="pf-next" aria-label="Next game">&#8250;</button>
      <div class="pf-counter" id="pf-counter">1 / 33</div>
    </div>

    <!-- Right: info -->
    <div class="pf-info-panel">
      <div class="pf-info-inner">

        <span class="section-tag">// portfolio</span>
        <h1 class="pf-page-title">20+ Years of Game Development</h1>

        <div class="pf-filters">
          <button class="pf-filter active" data-filter="all">All</button>
          <button class="pf-filter" data-filter="wayforward">WayForward</button>
          <button class="pf-filter" data-filter="disney">Disney / Avalanche</button>
          <button class="pf-filter" data-filter="recent">Recent</button>
        </div>

        <div class="pf-game-info">
          <h2 class="pf-game-title" id="pf-title"></h2>
          <div class="pf-year-line" id="pf-year-line"></div>
          <div class="pf-meta" id="pf-meta"></div>
          <p class="pf-desc" id="pf-desc"></p>
        </div>

      </div>

      <footer class="footer pf-footer">
        <div class="footer-inner">
          <span class="footer-name">Raymond Maple</span>
          <span class="footer-sep">·</span>
          <span class="footer-copy">&copy; 2026</span>
        </div>
      </footer>
    </div>

  </div>

  <script type="module" src="portfolio.js"></script>
</body>
</html>
